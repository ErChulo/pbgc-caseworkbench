<html lang="en">\r
<head>\r
  <meta charset="utf-8" />\r
  <meta name="viewport" content="width=device-width, initial-scale=1" />\r
  <title>R5 Builder — DOCX Auto-Filler (Browser-only) v0.7.9</title>\r
\r
  <style>\r
    :root{\r
      --bg:#0b0d10; --panel:#12161b; --muted:#94a3b8; --text:#e5e7eb;\r
      --accent:#60a5fa; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444;\r
      --border:#223043;\r
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;\r
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Liberation Sans", sans-serif;\r
    }\r
    body{ margin:0; font-family:var(--sans); background:var(--bg); color:var(--text); }\r
    .wrap{ max-width:1100px; margin:0 auto; padding:18px; }\r
    h1{ font-size:18px; margin:0 0 10px; }\r
    h2{ font-size:14px; margin:16px 0 8px; color:#cbd5e1; }\r
    p,li{ color:#cbd5e1; line-height:1.35; }\r
    .panel{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px; }\r
    .grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }\r
    .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }\r
    label{ font-size:12px; color:#cbd5e1; }\r
    input[type="text"], input[type="number"], textarea{\r
      background:#0f1318; border:1px solid var(--border); color:var(--text);\r
      border-radius:10px; padding:9px; min-width:260px;\r
    }\r
    textarea{ min-width: 420px; width:100%; min-height: 74px; resize: vertical; font-family: var(--mono); font-size: 12px; }\r
    input[type="file"]{\r
      background:#0f1318; border:1px dashed var(--border); color:var(--text);\r
      border-radius:10px; padding:10px; min-width:320px;\r
    }\r
    button{\r
      background:var(--accent); border:none; color:#071018; font-weight:700;\r
      border-radius:12px; padding:10px 14px; cursor:pointer;\r
    }\r
    button.secondary{\r
      background:#1f2a37; color:#e5e7eb; border:1px solid var(--border);\r
    }\r
    button:disabled{ opacity:.55; cursor:not-allowed; }\r
    .small{ font-size:12px; color:var(--muted); }\r
    .mono{ font-family:var(--mono); }\r
    .doclist{ width:100%; border-collapse:collapse; }\r
    .doclist th,.doclist td{ border-bottom:1px solid var(--border); padding:10px; vertical-align:top; }\r
    .doclist th{ text-align:left; color:#cbd5e1; font-size:12px; }\r
    .tag{ display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; margin-left:8px; }\r
    .ok{ background:rgba(34,197,94,.18); color:#86efac; border:1px solid rgba(34,197,94,.35); }\r
    .warn{ background:rgba(245,158,11,.18); color:#fdba74; border:1px solid rgba(245,158,11,.35); }\r
    .bad{ background:rgba(239,68,68,.18); color:#fecaca; border:1px solid rgba(239,68,68,.35); }\r
    .hr{ height:1px; background:var(--border); margin:12px 0; }\r
    .logs{ white-space:pre-wrap; font-family:var(--mono); background:#0f1318; border:1px solid var(--border); border-radius:12px; padding:10px; min-height:90px; }\r
    a.dl{ display:inline-block; margin:8px 10px 0 0; color:#93c5fd; text-decoration:none; border:1px solid rgba(96,165,250,.35); padding:8px 10px; border-radius:10px; }\r
    .kbd{ font-family:var(--mono); font-size:12px; padding:2px 6px; border:1px solid var(--border); border-bottom-width:2px; border-radius:8px; background:#0f1318; }\r
    @media (max-width: 900px){\r
      .grid{ grid-template-columns:1fr; }\r
      input[type="text"], textarea{ min-width: 220px; width: 100%; }\r
      input[type="file"]{ min-width: 220px; width: 100%; }\r
    }\r
  </style>\r
</head>\r
\r
<body>\r
<div class="wrap">\r
  <h1>R5 Builder — DOCX Auto-Filler (Browser-only) v0.7.9</h1>\r
\r
  <div class="panel">\r
    <h2>Step 1 — Upload files</h2>\r
    <div class="row">\r
      <label>Plan Summary Shell (DOCX)</label><br/>\r
      <input id="templateFile" type="file" accept=".docx" />\r
    </div>\r
    <div class="row" style="margin-top:10px;">\r
      <label>R5 JSONs (multiple)</label><br/>\r
      <input id="jsonFiles" type="file" accept=".json,application/json" multiple />\r
    </div>\r
    <div class="row" style="margin-top:10px;">\r
      <label>Case/Document Metadata (optional JSON)</label><br/>\r
      <input id="metaFile" type="file" accept=".json,application/json" />\r
    </div>\r
    <div class="small">Metadata JSON can populate case header fields and per-document Effective Date / Phase-In / Image Viewer IDs. No values are invented.</div>\r
\r
    <div class="hr"></div>\r
\r
    <div class="grid">\r
      <div>\r
        <h2>Step 2 — Case header (optional)</h2>\r
        <div class="row"><label>Plan Name</label><br/><input id="planName" type="text" /></div>\r
        <div class="row"><label>Case Number</label><br/><input id="caseNumber" type="text" /></div>\r
        <div class="row"><label>Case Processing Section</label><br/><input id="caseProcessingSection" type="text" /></div>\r
        <div class="row"><label>Actuary</label><br/><input id="actuary" type="text" /></div>\r
        <div class="row"><label>Auditor</label><br/><input id="auditor" type="text" /></div>\r
\r
        <div class="row"><label>DOPT</label><br/><input id="dopt" type="text" placeholder="MM/DD/YYYY" /></div>\r
        <div class="row"><label>DOTR</label><br/><input id="dotr" type="text" placeholder="MM/DD/YYYY" /></div>\r
        <div class="row"><label>NOD Date</label><br/><input id="nodDate" type="text" placeholder="MM/DD/YYYY" /></div>\r
        <div class="row"><label>NOIT Date</label><br/><input id="noitDate" type="text" placeholder="MM/DD/YYYY" /></div>\r
        <div class="row"><label>BPD (Bankruptcy)</label><br/><input id="bpdDate" type="text" placeholder="MM/DD/YYYY" /></div>\r
        <div class="row"><label>DOBF</label><br/><input id="dobf" type="text" placeholder="MM/DD/YYYY" /></div>\r
        <div class="row"><label>Facility Closing Date</label><br/><input id="facilityClosingDate" type="text" placeholder="MM/DD/YYYY" /></div>\r
\r
        <div class="row"><label>Employer Status</label><br/><input id="employerStatus" type="text" /></div>\r
        <div class="row"><label>Successor Plan</label><br/><input id="successorPlan" type="text" /></div>\r
\r
        <div class="row"><label>Plan Assets</label><br/><input id="planAssets" type="text" /></div>\r
        <div class="row"><label>Funding Status</label><br/><input id="fundingStatus" type="text" /></div>\r
        <div class="row"><label>SPARR</label><br/><input id="sparr" type="text" /></div>\r
      </div>\r
\r
      <div>\r
        <h2>Step 3 — PBGC rates (from metadata, editable)</h2>\r
        <div class="small">These fields are written into the 2nd table on page 1 of the Shell.</div>\r
\r
        <div class="row" style="margin-top:10px; width:100%;">\r
          <label>PBGC Lump Sum Rates — Immediate Rate</label><br/>\r
          <textarea id="pbgcLumpImmediate" placeholder="Example (multi-line):&#10;0.87% for 5 years&#10;2.74% for 15 years&#10;3.16% thereafter"></textarea>\r
        </div>\r
\r
        <div class="row" style="margin-top:10px; width:100%;">\r
          <label>PBGC Lump Sum Rates — Deferral Rate</label><br/>\r
          <textarea id="pbgcLumpDeferral" placeholder="Example: 8.4%"></textarea>\r
        </div>\r
\r
        <div class="row" style="margin-top:10px; width:100%;">\r
          <label>PBGC Annuity Rates</label><br/>\r
          <textarea id="pbgcAnnuityRates" placeholder="Example (multi-line):&#10;2.40% for 20 years&#10;2.11% thereafter"></textarea>\r
        </div>\r
      </div>\r
    </div>\r
\r
    <div class="hr"></div>\r
\r
    <div class="row">\r
      <label><input id="includeCitation" type="checkbox" checked /> Include citation line under each answer</label>\r
    </div>\r
  </div>\r
\r
  <div class="panel" style="margin-top:14px;">\r
    <h2>Loaded documents (order matters)</h2>\r
    <div class="small">The template supports 3 document columns per output DOCX. If you load more than 3 documents, the app will generate multiple DOCXs and bundle them in a ZIP.</div>\r
    <div class="hr"></div>\r
\r

\r
    <div class="hr"></div>\r
    <div class="row">\r
      <button id="generateBtn" disabled>Generate R5 DOCX</button>\r

\r
  <div class="panel" style="margin-top:14px;">\r
    <h2>Troubleshooting</h2>\r
    <ul>\r
      <li>If status says <span class="kbd">JSZip not loaded</span>, your network blocks CDNs. Fix: run with internet or use a local server and a local JSZip file.</li>\r
      <li>If Word shows “We found a problem with some content”, it usually means <span class="mono">word/document.xml</span> got malformed. The report will show the exact row/item that caused it.</li>\r
      <li>If some rows remain blank: confirm your JSON includes <span class="mono">item_id</span> 1–61 with non-empty <span class="mono">answer</span>.</li>\r
    </ul>\r
  </div>\r
</div>\r
\r
<script>\r
(() => {\r
  // ---- Constants ----\r
  const W_NS = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";\r
\r
  // Mapping: R5 item_id -> row index in the Plan Provisions table (3rd table in shell)\r
  const ITEM_TO_ROW = {\r
    1: 2,  2: 5,  3: 9,  4: 10, 5: 11,\r
    6: 13, 7: 14, 8: 15, 9: 16, 10: 17,\r
    11: 18, 12: 19, 13: 20, 14: 21,\r
    15: 23, 16: 24, 17: 25, 18: 26,\r
    19: 28, 20: 29, 21: 30, 22: 31,\r
    23: 32, 24: 33, 25: 34,\r
    26: 36, 27: 37, 28: 38, 29: 39, 30: 40, 31: 41,\r
    32: 43, 33: 44, 34: 45,\r
    35: 47, 36: 48, 37: 49,\r
    38: 50, 39: 51, 40: 52,\r
    41: 53, 42: 55, 43: 56,\r
    44: 58, 45: 59, 46: 60,\r
    47: 61, 48: 63, 49: 64, 50: 65, 51: 66,\r
    52: 68, 53: 69, 54: 70, 55: 71, 56: 72, 57: 73,\r
    58: 74, 59: 75, 60: 76, 61: 77\r
  };\r
\r
  // ---- DOM ----\r
  const elTemplate = document.getElementById("templateFile");\r
  const elJsons = document.getElementById("jsonFiles");\r
  const elMetaFile = document.getElementById("metaFile");\r
  const elGenerate = document.getElementById("generateBtn");\r
  const elClear = document.getElementById("clearBtn");\r
  const elTbody = document.getElementById("docTbody");\r
  const elReport = document.getElementById("report");\r
  const elDownloads = document.getElementById("downloads");\r
  const elIncludeCitation = document.getElementById("includeCitation");\r
  const elStatus = document.getElementById("statusPill");\r
\r
  // Case header inputs\r
  const elPlanName = document.getElementById("planName");\r
  const elCaseNumber = document.getElementById("caseNumber");\r
  const elCaseProcessingSection = document.getElementById("caseProcessingSection");\r
  const elActuary = document.getElementById("actuary");\r
  const elAuditor = document.getElementById("auditor");\r
  const elDopt = document.getElementById("dopt");\r
  const elDotr = document.getElementById("dotr");\r
  const elNodDate = document.getElementById("nodDate");\r
  const elNoitDate = document.getElementById("noitDate");\r
  const elBpdDate = document.getElementById("bpdDate");\r
  const elDobf = document.getElementById("dobf");\r
  const elFacilityClosingDate = document.getElementById("facilityClosingDate");\r
  const elEmployerStatus = document.getElementById("employerStatus");\r
  const elSuccessorPlan = document.getElementById("successorPlan");\r
  const elPlanAssets = document.getElementById("planAssets");\r
  const elFundingStatus = document.getElementById("fundingStatus");\r
  const elSparr = document.getElementById("sparr");\r
\r
  // PBGC rates inputs\r
  const elPbgcLumpImmediate = document.getElementById("pbgcLumpImmediate");\r
  const elPbgcLumpDeferral = document.getElementById("pbgcLumpDeferral");\r
  const elPbgcAnnuityRates = document.getElementById("pbgcAnnuityRates");\r
\r
  // ---- State ----\r
  let templateBytes = null;\r
  let docs = []; // { fileName, document, itemsById, meta:{effectiveDate,phaseIn,imageViewer}, problems:[] }\r
  let meta = null;\r
\r
  // ---- Helpers ----\r
  const log = (s) => { elReport.textContent += s + "\\n"; };\r
  const resetLog = () => { elReport.textContent = ""; };\r
  const setStatus = (kind, text) => {\r
    elStatus.classList.remove("ok","warn","bad");\r
    elStatus.classList.add(kind);\r
    elStatus.textContent = text;\r
  };\r
  const safeText = (s) => (s===null || s===undefined) ? "" : String(s);\r
  const norm = (s) => safeText(s).replace(/\\u00a0/g," ").replace(/\\s+/g," ").trim();\r
  const normLower = (s) => norm(s).toLowerCase();\r
\r
  function readFileAsArrayBuffer(file){\r
    return new Promise((resolve,reject)=>{\r
      const fr = new FileReader();\r
      fr.onload = () => resolve(fr.result);\r
      fr.onerror = () => reject(fr.error);\r
      fr.readAsArrayBuffer(file);\r
    });\r
  }\r
  function readFileAsText(file){\r
    return new Promise((resolve,reject)=>{\r
      const fr = new FileReader();\r
      fr.onload = () => resolve(fr.result);\r
      fr.onerror = () => reject(fr.error);\r
      fr.readAsText(file);\r
    });\r
  }\r
  function downloadBlob(filename, blob){\r
    const a = document.createElement("a");\r
    const url = URL.createObjectURL(blob);\r
    a.href = url;\r
    a.download = filename;\r
    a.className = "dl";\r
    a.textContent = "Download " + filename;\r
    elDownloads.appendChild(a);\r
  }\r
\r
  // ---- WordprocessingML helpers ----\r
  function isW(el, localName){\r
    return el && el.nodeType === 1 && (el.localName === localName) && (el.namespaceURI === W_NS);\r
  }\r
  function directChildren(parent, localName){\r
    const out = [];\r
    for (const n of Array.from(parent.childNodes || [])){\r
      if (isW(n, localName)) out.push(n);\r
    }\r
    return out;\r
  }\r
  function descendants(parent, localName){\r
    return Array.from(parent.getElementsByTagNameNS(W_NS, localName));\r
  }\r
  function qAll(node, localName){ return descendants(node, localName); }\r
  function q1(node, localName){\r
    const arr = descendants(node, localName);\r
    return arr.length ? arr[0] : null;\r
  }\r
  function firstChild(parent, localName){\r
    for (const n of Array.from(parent.childNodes || [])){\r
      if (isW(n, localName)) return n;\r
    }\r
    return null;\r
  }\r
  function attrVal(el, local){\r
    if (!el || !el.attributes) return null;\r
    let v = el.getAttribute("w:"+local) || el.getAttribute(local);\r
    if (v) return v;\r
    for (const a of el.attributes){\r
      if ((a.name||"").endsWith(":"+local)) return a.value;\r
    }\r
    return null;\r
  }\r
\r
  function getCellByGridCol(tr, gridCol){\r
    // gridCol: 0..N\r
    const tcs = directChildren(tr, "tc");\r
    let col = 0;\r
    for (const tc of tcs){\r
      const tcPr = firstChild(tc, "tcPr");\r
      const gsEl = tcPr ? firstChild(tcPr, "gridSpan") : null;\r
      const span = gsEl ? parseInt(attrVal(gsEl,"val") || "1", 10) : 1;\r
      if (gridCol >= col && gridCol < col + span){\r
        return tc;\r
      }\r
      col += span;\r
    }\r
    return null;\r
  }\r
\r
  function setCellText(xmlDoc, tc, text){\r
    const lines = safeText(text).split(/\\r?\\n/);\r
    let p = q1(tc, "p");\r
    if (!p){\r
      p = xmlDoc.createElementNS(W_NS, "w:p");\r
      tc.appendChild(p);\r
    }\r
    const pPr = firstChild(p, "pPr");\r
    const kids = Array.from(p.childNodes);\r
    for (const k of kids){\r
      if (pPr && k === pPr) continue;\r
      p.removeChild(k);\r
    }\r
    function addRunWithText(t){\r
      const r = xmlDoc.createElementNS(W_NS, "w:r");\r
      const tt = xmlDoc.createElementNS(W_NS, "w:t");\r
      tt.setAttribute("xml:space","preserve");\r
      tt.textContent = t;\r
      r.appendChild(tt);\r
      p.appendChild(r);\r
    }\r
    function addBreak(){\r
      const r = xmlDoc.createElementNS(W_NS, "w:r");\r
      const br = xmlDoc.createElementNS(W_NS, "w:br");\r
      r.appendChild(br);\r
      p.appendChild(r);\r
    }\r
    lines.forEach((ln, i) => {\r
      addRunWithText(ln);\r
      if (i < lines.length-1) addBreak();\r
    });\r
  }\r
\r
  function getCellPlainText(tc){\r
    const txt = safeText(tc.textContent || "");\r
    return norm(txt);\r
  }\r
\r
  function findHeaderTable(xmlDoc){\r
    const tables = qAll(xmlDoc, "tbl");\r
    for (const tbl of tables){\r
      const t = normLower(tbl.textContent || "");\r
      if (t.includes("plan name:") && t.includes("case number:")) return tbl;\r
    }\r
    return tables.length ? tables[0] : null;\r
  }\r
\r
  function fillHeaderTableByLabels(xmlDoc){\r
    const tbl = findHeaderTable(xmlDoc);\r
    if (!tbl) return;\r
\r
    const rows = directChildren(tbl, "tr");\r
    const map = [\r
      { label:"Plan Name:", value: elPlanName.value },\r
      { label:"Case Number:", value: elCaseNumber.value },\r
      { label:"Case Processing Section:", value: elCaseProcessingSection.value },\r
      { label:"Actuary:", value: elActuary.value },\r
      { label:"Auditor:", value: elAuditor.value },\r
      { label:"DOPT:", value: elDopt.value },\r
      { label:"DOTR:", value: elDotr.value },\r
      { label:"NOD Date:", value: elNodDate.value },\r
      { label:"NOIT Date:", value: elNoitDate.value },\r
      { label:"BPD (Bankruptcy):", value: elBpdDate.value },\r
      { label:"DOBF:", value: elDobf.value },\r
      { label:"Facility Closing Date:", value: elFacilityClosingDate.value },\r
      { label:"Employer Status:", value: elEmployerStatus.value },\r
      { label:"Successor Plan:", value: elSuccessorPlan.value },\r
      { label:"Plan Assets:", value: elPlanAssets.value },\r
      { label:"Funding Status:", value: elFundingStatus.value },\r
      { label:"SPARR:", value: elSparr.value }\r
    ];\r
\r
    const want = new Map(map.map(x => [normLower(x.label), x.value]));\r
    if (![...want.values()].some(v => norm(v) !== "")) return;\r
\r
    for (const tr of rows){\r
      const tcs = directChildren(tr, "tc");\r
      for (let i=0; i<tcs.length-1; i++){\r
        const here = norm(getCellPlainText(tcs[i]));\r
        if (!here.endsWith(":")) continue;\r
\r
        const key = normLower(here);\r
        if (!want.has(key)) continue;\r
\r
        const v = safeText(want.get(key)).trim();\r
        if (!v) continue;\r
\r
        const tcValue = tcs[i+1];\r
        setCellText(xmlDoc, tcValue, v);\r
      }\r
    }\r
  }\r
\r
  function findPbgcRatesTable(xmlDoc){\r
    const tables = qAll(xmlDoc, "tbl");\r
    for (const tbl of tables){\r
      const t = normLower(tbl.textContent || "");\r
      if (t.includes("pbgc lump sum rates:") && t.includes("pbgc annuity rates:")) return tbl;\r
    }\r
    return null;\r
  }\r
\r
  function splitLines(s){\r
    return safeText(s).split(/\\r?\\n/).map(x=>x.trim()).filter(x=>x.length>0);\r
  }\r
\r
  // v0.7.9 FIX: write PBGC rates by finding the label cells and writing into the correct cells\r
  function fillPbgcRatesTable(xmlDoc){\r
    const tbl = findPbgcRatesTable(xmlDoc);\r
    if (!tbl) return;\r
\r
    const lumpImmediate = safeText(elPbgcLumpImmediate.value).trim();\r
    const lumpDeferral = safeText(elPbgcLumpDeferral.value).trim();\r
    const annuityRates = safeText(elPbgcAnnuityRates.value).trim();\r
\r
    const hasAny = (lumpImmediate || lumpDeferral || annuityRates);\r
    if (!hasAny) return;\r
\r
    const rows = directChildren(tbl, "tr");\r
\r
    // detect segment-style table (First/Second/Third Segment)\r
    const tblText = normLower(tbl.textContent || "");\r
    const segmentMode = tblText.includes("first segment:") && tblText.includes("second segment:");\r
\r
    if (segmentMode){\r
      // Map lumpImmediate lines to first/second/third segment cells\r
      const lines = splitLines(lumpImmediate);\r
      const want = {\r
        "first segment:": (lines[0] ?? ""),\r
        "second segment:": (lines[1] ?? ""),\r
        "third segment:": (lines[2] ?? "")\r
      };\r
\r
      for (const tr of rows){\r
        const tcs = directChildren(tr, "tc");\r
        for (const tc of tcs){\r
          const txt = normLower(getCellPlainText(tc));\r
          for (const k of Object.keys(want)){\r
            if (txt.startsWith(k) && want[k]){\r
              // preserve label, replace value\r
              const label = k.replace(/\\s+/g," ").replace(/^(\\w)/, c=>c.toUpperCase()); // crude cap\r
              // keep original label casing if possible\r
              const orig = norm(getCellPlainText(tc));\r
              const prefix = orig.split(":")[0] + ":";\r
              setCellText(xmlDoc, tc, \`\${prefix} \${want[k]}\`);\r
            }\r
          }\r
        }\r
      }\r
    } else {\r
      // Immediate/Deferral style: append value into the same label cell (do NOT touch annuity cells)\r
      for (const tr of rows){\r
        const tcs = directChildren(tr, "tc");\r
        for (const tc of tcs){\r
          const txt = normLower(getCellPlainText(tc));\r
          if (txt.startsWith("immediate rate:") && lumpImmediate){\r
            setCellText(xmlDoc, tc, "Immediate Rate:\\n" + lumpImmediate);\r
          }\r
          if (txt.startsWith("deferral rate:") && lumpDeferral){\r
            setCellText(xmlDoc, tc, "Deferral Rate:\\n" + lumpDeferral);\r
          }\r
        }\r
      }\r
    }\r
\r
    // Annuity rates: write into the cell(s) immediately to the right of "PBGC Annuity Rates:"\r
    if (annuityRates){\r
      const lines = splitLines(annuityRates);\r
\r
      for (let r=0; r<rows.length; r++){\r
        const tr = rows[r];\r
        const tcs = directChildren(tr, "tc");\r
        for (let c=0; c<tcs.length-1; c++){\r
          const txt = normLower(getCellPlainText(tcs[c]));\r
          if (txt.includes("pbgc annuity rates:")){\r
            const val0 = tcs[c+1];\r
\r
            if (lines.length === 1){\r
              setCellText(xmlDoc, val0, lines[0]);\r
              return;\r
            }\r
\r
            // If subsequent rows have a value cell in the same column index (c+1), fill line-by-line.\r
            setCellText(xmlDoc, val0, lines[0]);\r
\r
            for (let k=1; k<lines.length; k++){\r
              const rr = r + k;\r
              if (rr < rows.length){\r
                const trr = rows[rr];\r
                const tcs2 = directChildren(trr, "tc");\r
                if (tcs2.length > (c+1)){\r
                  setCellText(xmlDoc, tcs2[c+1], lines[k]);\r
                } else {\r
                  // fallback: append to first value cell\r
                  setCellText(xmlDoc, val0, [lines[0], ...lines.slice(1)].join("\\n"));\r
                  return;\r
                }\r
              } else {\r
                setCellText(xmlDoc, val0, [lines[0], ...lines.slice(1)].join("\\n"));\r
                return;\r
              }\r
            }\r
            return;\r
          }\r
        }\r
      }\r
    }\r
  }\r
\r
  function findPlanProvisionsTable(xmlDoc){\r
    const tables = qAll(xmlDoc, "tbl");\r
    for (const tbl of tables){\r
      const txt = safeText(tbl.textContent || "");\r
      const rows = qAll(tbl, "tr").length;\r
      if (txt.includes("Plan Provisions") && rows >= 70) return tbl;\r
    }\r
    return null;\r
  }\r
\r
  // ---- JSON normalization ----\r
  function normalizeR5Json(obj, fileName){\r
    let document = obj.document || obj.doc || obj.plan_document || obj.plan || {};\r
    if (typeof document === "string") document = { name: document };\r
    if (!document || typeof document !== "object") document = {};\r
    if (!document.name) document.name = obj.document_name || obj.doc_name || obj.title || fileName;\r
\r
    let rawItems = obj.items || obj.r5_items || obj.answers || obj.responses || null;\r
    let arr = [];\r
\r
    if (Array.isArray(rawItems)){\r
      arr = rawItems.slice();\r
    } else if (rawItems && typeof rawItems === "object"){\r
      for (const [k,v] of Object.entries(rawItems)){\r
        const id = (v && typeof v === "object" && Number.isFinite(v.item_id)) ? v.item_id : parseInt(k, 10);\r
        if (!Number.isFinite(id)) continue;\r
        if (!v || typeof v !== "object") continue;\r
        arr.push({ item_id: id, ...v });\r
      }\r
    }\r
\r
    if (!arr.length){\r
      for (const [k,v] of Object.entries(obj)){\r
        const id = parseInt(k, 10);\r
        if (!(id>=1 && id<=61)) continue;\r
        if (!v || typeof v !== "object") continue;\r
        arr.push({ item_id: id, ...v });\r
      }\r
    }\r
\r
    arr = arr\r
      .filter(it => Number.isFinite(it.item_id))\r
      .map(it => {\r
        const answer = (it.answer ?? it.summary_1line ?? it.summary ?? it.text ?? it.value ?? "").toString().trim();\r
        let citation_note = (it.citation_note ?? it.citation ?? it.source ?? it.ref ?? "").toString().trim();\r
        if (!citation_note && Array.isArray(it.references) && it.references.length){\r
          const r = it.references[0] || {};\r
          const sec = (r.section || r.sec || "").toString().trim();\r
          const pdfp = (r.page_pdf || r.pdf_page || r.page || "").toString().trim();\r
          const parts = [];\r
          if (sec) parts.push(sec);\r
          if (pdfp) parts.push("pdf p" + pdfp);\r
          citation_note = parts.length ? "(" + parts.join("; ") + ")" : "";\r
        }\r
        return {\r
          item_id: Number(it.item_id),\r
          item_text: (it.item_text ?? it.label ?? it.question ?? "").toString(),\r
          status: (it.status ?? "value").toString().toLowerCase(),\r
          answer,\r
          citation_note,\r
          references: it.references || []\r
        };\r
      });\r
\r
    return { document, items: arr };\r
  }\r
\r
  // ---- Metadata apply ----\r
  function applyMetadata(){\r
    if (!meta || typeof meta !== "object") return;\r
\r
    const c = meta.case || meta.header || meta.preamble || meta || {};\r
    const dep = meta.dependent_fields || meta.dependentFields || {};\r
\r
    const setIf = (el, v) => { if (v !== undefined && v !== null && String(v).trim() !== "") el.value = String(v); };\r
\r
    setIf(elPlanName, c.plan_name ?? c.planName);\r
    setIf(elCaseNumber, c.case_number ?? c.caseNumber);\r
    setIf(elCaseProcessingSection, c.case_processing_section ?? c.caseProcessingSection);\r
    setIf(elActuary, c.actuary);\r
    setIf(elAuditor, c.auditor);\r
\r
    setIf(elDopt, c.dopt);\r
    setIf(elDotr, c.dotr);\r
    setIf(elNodDate, c.nod_date ?? c.nodDate);\r
    setIf(elNoitDate, c.noit_date ?? c.noitDate);\r
    setIf(elBpdDate, c.bpd ?? c.bpd_date ?? c.bpdDate);\r
    setIf(elDobf, c.dobf);\r
    setIf(elFacilityClosingDate, c.facility_closing_date ?? c.facilityClosingDate);\r
\r
    setIf(elEmployerStatus, c.employer_status ?? c.employerStatus);\r
    setIf(elSuccessorPlan, c.successor_plan ?? c.successorPlan);\r
    setIf(elPlanAssets, c.plan_assets ?? c.planAssets);\r
    setIf(elFundingStatus, c.funding_status ?? c.fundingStatus);\r
    setIf(elSparr, c.sparr);\r
\r
    setIf(elPbgcLumpImmediate, dep.pbgc_lump_sum_immediate_rate ?? dep.pbgcLumpSumImmediateRate);\r
    setIf(elPbgcLumpDeferral, dep.pbgc_lump_sum_deferral_rate ?? dep.pbgcLumpSumDeferralRate);\r
    setIf(elPbgcAnnuityRates, dep.pbgc_annuity_rates ?? dep.pbgcAnnuityRates);\r
\r
    const docsMeta = meta.documents || meta.plan_documents || meta.docs || [];\r
    if (Array.isArray(docsMeta) && docsMeta.length){\r
      for (const dm of docsMeta){\r
        const sf = (dm.source_file ?? dm.sourceFile ?? "").toString();\r
        const nm = (dm.name ?? dm.document_name ?? "").toString();\r
        const id = (dm.doc_id ?? dm.docId ?? "").toString();\r
\r
        const target = docs.find(d => {\r
          const dName = safeText(d.document?.name || "");\r
          const dId = safeText(d.document?.doc_id || "");\r
          const dFile = safeText(d.fileName || "");\r
          return (sf && dFile === sf) || (nm && dName === nm) || (id && dId === id);\r
        });\r
\r
        if (!target) continue;\r
        if ((dm.effective_date ?? dm.effectiveDate) !== undefined) target.meta.effectiveDate = String(dm.effective_date ?? dm.effectiveDate);\r
        if ((dm.phase_in ?? dm.phaseIn) !== undefined) target.meta.phaseIn = String(dm.phase_in ?? dm.phaseIn);\r
        if ((dm.image_viewer ?? dm.imageViewer) !== undefined) target.meta.imageViewer = String(dm.image_viewer ?? dm.imageViewer);\r
      }\r
    }\r
\r
    log("Metadata applied.");\r
  }\r
\r
  function escapeHtml(s){\r
    return safeText(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));\r
  }\r
  function escapeAttr(s){ return escapeHtml(s); }\r
\r
  function buildDocUI(){\r
    if (!docs.length){\r
      elTbody.innerHTML = \`<tr><td colspan="4" class="small">No JSONs loaded yet.</td></tr>\`;\r
      return;\r
    }\r
    elTbody.innerHTML = "";\r
    docs.forEach((d, idx) => {\r
      const tr = document.createElement("tr");\r
      const name = safeText(d.document?.name || d.fileName || \`Doc \${idx+1}\`);\r
      const eff = safeText(d.meta.effectiveDate || "");\r
      const pin = safeText(d.meta.phaseIn || "");\r
      const ivn = safeText(d.meta.imageViewer || "");\r
      const parsedCount = d.itemsById.size;\r
\r
      const miss = d.problems.length\r
        ? \`<span class="tag bad">\${d.problems.length} issues</span> <span class="tag warn">\${parsedCount}/61 parsed</span>\`\r

\r
    elTbody.querySelectorAll("input[data-k]").forEach(inp => {\r

  elTemplate.addEventListener("change", async () => {\r

    } catch(err){\r

\r
  elJsons.addEventListener("change", async () => {\r

          if (d) setCellText(xmlDoc, tc, safeText(d.meta.imageViewer || ""));\r

\r

        if (!tr) continue;\r

        const tc = getCellByGridCol(tr, col);\r
        if (!tc) continue;\r
\r
        if (!d){\r
          setCellText(xmlDoc, tc, "");\r
          continue;\r
        }\r
\r
        const it = d.itemsById.get(itemId);\r

        const ans = safeText(it?.answer || "").trim();\r
        const cit = safeText(it?.citation_note || "").trim();\r
\r
        if (status === "blank"){\r
          setCellText(xmlDoc, tc, "");\r
          continue;\r

        if (!ans){\r

          setCellText(xmlDoc, tc, "");\r
          continue;\r
        }\r
\r
        const displayText = ans;\r
        const citationLine = elIncludeCitation.checked ? (cit ? cit : "") : "";\r
        const payload = citationLine ? \`\${displayText}\\n\${citationLine}\` : displayText;\r
        setCellText(xmlDoc, tc, payload);\r
        written++;\r
      }\r

      if (d) d._lastStats = { missing, written };\r
    }\r

    const outXml = new XMLSerializer().serializeToString(xmlDoc);\r
    zip.file("word/document.xml", outXml);\r
\r
    const outBytes = await zip.generateAsync({ type: "uint8array" });\r

\r
    return { fileName, blob };\r
  }\r
\r
  async function generateAll(){\r
    if (!window.JSZip) throw new Error("JSZip not loaded.");\r
    if (!templateBytes) throw new Error("No template DOCX loaded.");\r
    if (!docs.length) throw new Error("No JSON documents loaded.");\r
\r
    resetLog();\r
    elDownloads.innerHTML = "";\r
\r
    const chunks = [];\r
    for (let i=0; i<docs.length; i+=3) chunks.push(docs.slice(i, i+3));\r
\r
    log(\`Generating outputs for \${docs.length} document(s) => \${chunks.length} output file(s).\`);\r
\r
    const outputs = [];\r
    for (let ci=0; ci<chunks.length; ci++){\r
      const chunk = chunks[ci];\r
      const out = await generateOneDocxForChunk(chunk, ci, docs.length);\r
      outputs.push(out);\r
      downloadBlob(out.fileName, out.blob);\r
\r
      chunk.forEach(d => {\r
        const s = d._lastStats || {};\r
        log(\`Doc: \${safeText(d.document?.name || d.fileName)} | written=\${s.written ?? 0} | missing=\${s.missing ?? 0}\`);\r
      });\r
    }\r
\r
    if (outputs.length > 1){\r
      const z = new JSZip();\r
      for (const o of outputs){\r
        const ab = await o.blob.arrayBuffer();\r
        z.file(o.fileName, ab);\r
      }\r
      const zipBlob = await z.generateAsync({type:"blob"});\r
      const baseCase = (elCaseNumber.value || "TESTCASE").replace(/[^\\w\\-]+/g,"_");\r
      downloadBlob(\`\${baseCase}R5_v0.7.9_outputs.zip\`, zipBlob);\r
      log("ZIP bundle created.");\r
    }\r
\r
    setStatus("ok", \`Done: \${outputs.length} file(s)\`);\r
  }\r

      setStatus("bad","Error");\r
      log("ERROR: " + (err && err.message ? err.message : err));\r
      console.error(err);\r
    }\r
  });\r
\r
  // initial\r
  updateReadyState();\r
})();\r
<\/script>\r
</body>\r

const RISK_HELP_TEXT = 'Quality profile similarity compares operational warning patterns such as unresolved references, parse errors, empty formula arguments, circularity, high-degree hubs, and excessive complexity. It is not a percent-risk rating for the engine.';\r
const AGGREGATE_RISK_HELP_TEXT = 'Highest review risk is a raw attention score based on unresolved references, parse errors, empty formula arguments, circularity, high-degree hubs, and excessive complexity. Higher means more review attention is needed.';\r
\r
function datasetDisplayName(data, fallbackName){\r
  return fallbackName || data.engine_name || data.sheet_name || 'Loaded V1Summary.json';\r
}\r
\r
function datasetDisplayMeta(data){\r
  const bits = [];\r
  bits.push(data.schema_version ? \`Schema \${data.schema_version}\` : 'Schema legacy');\r
  bits.push(\`\${Object.keys(data.cells || {}).length} cells\`);\r
  bits.push(\`\${Object.keys(data.formulas || {}).length} formulas\`);\r
  bits.push(\`\${(data.namedRanges || []).length} named ranges\`);\r
  if ((data.sourceTabs || []).length) bits.push(\`\${data.sourceTabs.length} source tabs\`);\r
  return bits.join(' · ');\r
}\r
\r
function updateUploadStatus(nameText, metaText){\r
  if (uploadStatusName) uploadStatusName.textContent = nameText;\r
  if (uploadStatusMeta) uploadStatusMeta.textContent = metaText;\r
  if (currentEngineName) currentEngineName.textContent = nameText;\r

function updateUploadPanelStatus(nameText, metaText){\r

function updateWarehouseStatus(nameText, metaText){\r

function updateWarehouseMatchStatus(nameText, metaText){\r

  if (warehouseMatchMeta) warehouseMatchMeta.textContent = metaText;\r
}\r
\r
function formatMetricValue(value){\r
  if (typeof value === 'number') return Number.isInteger(value) ? String(value) : value.toFixed(2);\r
  if (typeof value === 'boolean') return value ? 'Yes' : 'No';\r
  return String(value ?? '-');\r
}\r
\r
function createRiskInfoIcon(helpText = RISK_HELP_TEXT){\r
  const info = document.createElement('span');\r
  info.className = 'info-icon';\r
  info.textContent = '';\r
  info.dataset.tooltip = helpText;\r
  info.tabIndex = 0;\r
  info.setAttribute('role', 'img');\r
  info.setAttribute('aria-label', helpText);\r
  return info;\r
}\r
\r
function metricTile(label, value){\r
  const tile = document.createElement('div');\r
  tile.className = 'metric-tile';\r
  const labelEl = document.createElement('div');\r
  labelEl.className = 'metric-label';\r
  labelEl.textContent = label;\r
  if (String(label).toLowerCase().includes('risk')) {\r
    labelEl.appendChild(createRiskInfoIcon(String(label).toLowerCase().includes('highest') ? AGGREGATE_RISK_HELP_TEXT : RISK_HELP_TEXT));\r
  }\r
  const valueEl = document.createElement('div');\r
  valueEl.className = 'metric-value';\r

  tile.appendChild(labelEl);\r

}\r
\r
function renderWarehouseMetrics(record){\r
  if (!warehouseMetrics) return;\r
  warehouseMetrics.innerHTML = '';\r
  if (!record) {\r
    warehouseMetrics.appendChild(metricTile('Stored', 0));\r
    warehouseMetrics.appendChild(metricTile('Metric rows', 0));\r
    return;\r
  }\r
  const counts = record.counts || {};\r
  const structural = record.metrics?.structural_metrics || {};\r
  const risk = record.metrics?.operational_data_quality_metrics || {};\r
  const tiles = [\r
    ['Cells', counts.cells || 0],\r
    ['Formulas', counts.formulas || 0],\r
    ['Named ranges', counts.namedRanges || 0],\r
    ['Tabs', counts.sourceTabs || 0],\r
    ['Runs', counts.runs || 0],\r
    ['Metric rows', counts.metricRows || (record.metricRows || []).length],\r
    ['Max depth', structural.max_dependency_depth || 0],\r
    ['Max fan in', structural.max_fan_in || 0],\r
    ['Max fan out', structural.max_fan_out || 0],\r
    ['Unresolved refs', risk.unresolved_reference_count || 0],\r
    ['Empty args', risk.empty_argument_formula_count || 0],\r
    ['Hubs', risk.high_degree_hub_count || 0]\r
  ];\r
  for (const [label, value] of tiles) warehouseMetrics.appendChild(metricTile(label, value));\r
}\r
\r
function addCounts(target, source){\r
  for (const [key, value] of Object.entries(source || {})) {\r
    const n = Number(value || 0);\r
    if (Number.isFinite(n)) target[key] = (target[key] || 0) + n;\r
  }\r
  return target;\r
}\r
\r
function topCountEntries(counts, limit=4){\r
  return Object.entries(counts || {})\r
    .filter(([, value]) => Number(value || 0) > 0)\r
    .sort((a, b) => Number(b[1] || 0) - Number(a[1] || 0) || a[0].localeCompare(b[0]))\r
    .slice(0, limit);\r
}\r
\r
function formatTopCounts(counts, limit=4){\r
  const entries = topCountEntries(counts, limit);\r
  if (!entries.length) return '-';\r
  return entries.map(([name, value]) => \`\${name}: \${formatMetricValue(value)}\`).join(', ');\r
}\r
\r
function recordRiskScore(record){\r
  const risk = record?.metrics?.operational_data_quality_metrics || {};\r
  return Number(risk.unresolved_reference_count || 0) * 3\r
    + Number(risk.unresolved_named_range_count || 0) * 2\r
    + Number(risk.unknown_tab_reference_count || 0) * 2\r
    + Number(risk.parse_error_count || 0) * 3\r
    + Number(risk.empty_argument_formula_count || 0)\r
    + Number(risk.circularity_node_count || 0) * 3\r
    + Number(risk.high_degree_hub_count || 0)\r
    + Number(risk.excessive_formula_nesting_count || 0);\r
}\r
\r
function recordComplexityScore(record){\r
  const structural = record?.metrics?.structural_metrics || {};\r
  const formula = record?.metrics?.formula_implementation_metrics || {};\r
  return Number(structural.node_count || 0)\r
    + Number(structural.edge_count || 0)\r
    + Number(structural.max_dependency_depth || 0) * 5\r
    + Number(structural.high_degree_hub_count || 0) * 10\r
    + Number(formula.average_formula_length || 0) / 20;\r
}\r
\r
function bestRecordBy(records, scorer){\r
  let best = null;\r
  let bestScore = -Infinity;\r
  for (const record of records || []) {\r
    const score = scorer(record);\r
    if (score > bestScore) {\r
      best = record;\r
      bestScore = score;\r
    }\r
  }\r
  return { record: best, score: Number((Number.isFinite(bestScore) ? bestScore : 0).toFixed(3)) };\r
}\r
\r
function pairwiseWarehouseSpread(records){\r
  if (!records || records.length < 2) return { pairCount: 0, mostSimilar: null, mostDistinct: null };\r
  let mostSimilar = null;\r
  let mostDistinct = null;\r
  let pairCount = 0;\r
  for (let i = 0; i < records.length; i++) {\r
    for (let j = i + 1; j < records.length; j++) {\r
      const a = records[i];\r
      const b = records[j];\r
      if (!a?.metrics || !b?.metrics) continue;\r
      const report = compareMetricWarehouses(a.metrics, b.metrics);\r
      const score = report.profile_scores.overall_weighted_similarity;\r
      const row = {\r
        engine_a_id: a.id,\r
        engine_b_id: b.id,\r
        engine_a_name: a.displayName || a.sourceName || a.id,\r
        engine_b_name: b.displayName || b.sourceName || b.id,\r
        distance: score.distance,\r
        similarity: score.similarity\r
      };\r
      pairCount++;\r
      if (!mostSimilar || row.similarity > mostSimilar.similarity) mostSimilar = row;\r
      if (!mostDistinct || row.distance > mostDistinct.distance) mostDistinct = row;\r
    }\r
  }\r
  return { pairCount, mostSimilar, mostDistinct };\r
}\r
\r
function warehouseReadiness(records){\r
  const counts = { candidate_count: 0, usable_count: 0, current_count: 0, stale_count: 0, recomputable_count: 0, skipped_count: 0 };\r
  for (const record of records || []) {\r
    counts.candidate_count++;\r
    const validation = validateWarehouseRecord(record);\r
    if (validation.status === 'current') counts.current_count++;\r
    if (validation.status === 'stale') counts.stale_count++;\r
    if (validation.status === 'recomputable') counts.recomputable_count++;\r
    if (validation.status === 'unusable') counts.skipped_count++;\r
    if (['current', 'stale', 'recomputable'].includes(validation.status)) counts.usable_count++;\r
  }\r
  return counts;\r
}\r
\r
function computeWarehouseAggregate(records){\r
  const engines = Array.isArray(records) ? records : [];\r
  const totals = { cells: 0, formulas: 0, sourceTabs: 0, runs: 0, namedRanges: 0, metricRows: 0 };\r
  const benefitDomains = {};\r
  const functions = {};\r
  const depths = [];\r
  const formulaCounts = [];\r
  const riskScores = [];\r
\r
  for (const record of engines) {\r
    const counts = record.counts || {};\r
    totals.cells += Number(counts.cells || 0);\r
    totals.formulas += Number(counts.formulas || 0);\r
    totals.sourceTabs += Number(counts.sourceTabs || 0);\r
    totals.runs += Number(counts.runs || 0);\r
    totals.namedRanges += Number(counts.namedRanges || 0);\r
    totals.metricRows += Number(counts.metricRows || (record.metricRows || []).length || 0);\r
    addCounts(benefitDomains, record.metrics?.benefit_architecture_metrics?.domain_counts || record.metrics?.benefit_architecture_metrics?.category_counts);\r
    addCounts(functions, record.metrics?.formula_implementation_metrics?.function_counts);\r
    depths.push(Number(record.metrics?.structural_metrics?.max_dependency_depth || 0));\r
    formulaCounts.push(Number(counts.formulas || record.metrics?.structural_metrics?.formula_cell_count || 0));\r
    riskScores.push(recordRiskScore(record));\r
  }\r
\r
  const engineCount = engines.length;\r
  const complexity = bestRecordBy(engines, recordComplexityScore);\r
  const risk = bestRecordBy(engines, recordRiskScore);\r
  const spread = pairwiseWarehouseSpread(engines);\r
  const readiness = warehouseReadiness(engines);\r
  return {\r
    engine_count: engineCount,\r
    readiness,\r
    totals,\r
    averages: {\r
      cells_per_engine: engineCount ? totals.cells / engineCount : 0,\r
      formulas_per_engine: engineCount ? totals.formulas / engineCount : 0,\r
      tabs_per_engine: engineCount ? totals.sourceTabs / engineCount : 0\r
    },\r
    common_benefit_domains: topCountEntries(benefitDomains, 8).map(([name, count]) => ({ name, count })),\r
    common_functions: topCountEntries(functions, 8).map(([name, count]) => ({ name, count })),\r
    structural_complexity_range: {\r
      min_depth: depths.length ? Math.min(...depths) : 0,\r
      max_depth: depths.length ? Math.max(...depths) : 0,\r
      min_formulas: formulaCounts.length ? Math.min(...formulaCounts) : 0,\r
      max_formulas: formulaCounts.length ? Math.max(...formulaCounts) : 0\r
    },\r
    highest_risk_engine: risk.record ? {\r
      id: risk.record.id,\r
      name: risk.record.displayName || risk.record.sourceName || risk.record.id,\r
      score: risk.score\r
    } : null,\r
    most_complex_engine: complexity.record ? {\r
      id: complexity.record.id,\r
      name: complexity.record.displayName || complexity.record.sourceName || complexity.record.id,\r
      score: complexity.score\r
    } : null,\r
    pairwise_spread: spread,\r
    risk_score_range: {\r
      min: riskScores.length ? Math.min(...riskScores) : 0,\r
      max: riskScores.length ? Math.max(...riskScores) : 0\r
    }\r
  };\r
}\r
\r
function pairLabel(pair){\r
  if (!pair) return '-';\r
  return \`\${scorePercent(pair.similarity)} \${pair.engine_a_name} / \${pair.engine_b_name}\`;\r
}\r
\r
function renderWarehouseAggregate(records){\r
  if (!warehouseAggregateResults) return;\r
  warehouseAggregateResults.innerHTML = '';\r
  const summary = computeWarehouseAggregate(records || []);\r
  const tiles = [\r
    ['Engines', summary.engine_count],\r
    ['Avg formulas', summary.averages.formulas_per_engine],\r
    ['Avg cells', summary.averages.cells_per_engine],\r
    ['Usable', \`\${summary.readiness.usable_count}/\${summary.readiness.candidate_count}\`],\r
    ['Stale', summary.readiness.stale_count + summary.readiness.recomputable_count],\r
    ['Skipped', summary.readiness.skipped_count],\r
    ['Depth range', \`\${summary.structural_complexity_range.min_depth}-\${summary.structural_complexity_range.max_depth}\`],\r
    ['Benefit domains', formatTopCounts(Object.fromEntries(summary.common_benefit_domains.map(item => [item.name, item.count])), 8)],\r
    ['Functions', formatTopCounts(Object.fromEntries(summary.common_functions.map(item => [item.name, item.count])), 8)],\r
    ['Highest risk', summary.highest_risk_engine ? \`\${summary.highest_risk_engine.name} (\${summary.highest_risk_engine.score})\` : '-'],\r
    ['Most complex', summary.most_complex_engine ? \`\${summary.most_complex_engine.name} (\${summary.most_complex_engine.score})\` : '-'],\r
    ['Most similar pair', pairLabel(summary.pairwise_spread.mostSimilar)],\r
    ['Most distinct pair', summary.pairwise_spread.mostDistinct ? \`\${scorePercent(1 - summary.pairwise_spread.mostDistinct.similarity)} dist\` : '-']\r
  ];\r
  for (const [label, value] of tiles) warehouseAggregateResults.appendChild(metricTile(label, value));\r
  return summary;\r
}\r
\r
function scorePercent(value){\r
  const pct = Math.round(clamp01(Number(value || 0)) * 100);\r
  return \`\${pct}%\`;\r
}\r
\r
function updateWarehouseCompareButton(){\r
  if (!warehouseCompareButton || !warehouseCompareA || !warehouseCompareB) return;\r
  warehouseCompareButton.disabled = !warehouseCompareA.value || !warehouseCompareB.value || warehouseCompareA.value === warehouseCompareB.value;\r

\r
function renderWarehouseCompareOptions(records, selectedA='', selectedB=''){\r
  if (!warehouseCompareA || !warehouseCompareB) return;\r
  const selects = [warehouseCompareA, warehouseCompareB];\r

  warehouseCompareB.value = selectedB && records.some(record => record.id === selectedB) ? selectedB : defaultB;\r
  updateWarehouseCompareButton();\r
}\r
\r
function renderWarehouseComparison(report){\r
  if (!warehouseCompareResults) return;\r
  warehouseCompareResults.innerHTML = '';\r
  if (!report) {\r
    warehouseCompareResults.appendChild(metricTile('Overall', '-'));\r
    warehouseCompareResults.appendChild(metricTile('Top difference', '-'));\r
    return;\r
  }\r
  const profile = report.profile_scores || {};\r
  const family = report.family_distances || {};\r
  const top = report.top_differences?.[0];\r
  const overall = profile.overall_weighted_similarity || {};\r
  const summary = document.createElement('div');\r
  summary.className = 'comparison-overall-summary';\r
  const similarity = document.createElement('div');\r
  similarity.innerHTML = \`<div class="summary-label">Overall similarity</div><div class="summary-value">\${scorePercent(overall.similarity)}</div><div class="summary-note">Weighted across benefit, formula, field, structure, and quality profile.</div>\`;\r
  const distance = document.createElement('div');\r
  distance.innerHTML = \`<div class="summary-label">Overall distance</div><div class="summary-value">\${scorePercent(overall.distance)}</div><div class="summary-note">Lower distance means the engines are closer.</div>\`;\r
  summary.appendChild(similarity);\r
  summary.appendChild(distance);\r
  warehouseCompareResults.appendChild(summary);\r
  const tiles = [\r
    ['Overall', scorePercent(overall.similarity)],\r
    ['Formula', scorePercent(profile.formula_similarity?.similarity)],\r
    ['Benefit', scorePercent(profile.benefit_architecture_similarity?.similarity)],\r
    ['Quality profile', scorePercent(profile.risk_complexity_similarity?.similarity)],\r
    ['Structure dist', family.structural_graph?.distance ?? 0],\r
    ['Top difference', top ? \`\${top.family}: \${top.name}\` : 'None']\r
  ];\r
  for (const [label, value] of tiles) warehouseCompareResults.appendChild(metricTile(label, value));\r
}\r
\r
const currentMetricCache = { dataVersion: -1, metrics: null, hits: 0, misses: 0 };\r
\r
function currentEngineWarehouseMetrics(){\r
  if (currentMetricCache.metrics && currentMetricCache.dataVersion === appState.dataVersion) {\r
    currentMetricCache.hits++;\r
    return currentMetricCache.metrics;\r
  }\r
  currentMetricCache.misses++;\r
  currentMetricCache.dataVersion = appState.dataVersion;\r
  currentMetricCache.metrics = computeEngineMetrics(DATA, datasetDisplayName(DATA, 'current'));\r
  return currentMetricCache.metrics;\r
}\r
\r
function resetCurrentMetricCache(){\r
  currentMetricCache.dataVersion = -1;\r
  currentMetricCache.metrics = null;\r
}\r
\r
function warehouseDebugStats(){\r
  return {\r
    currentMetricCache: {\r
      dataVersion: currentMetricCache.dataVersion,\r
      hits: currentMetricCache.hits,\r
      misses: currentMetricCache.misses\r
    }\r
  };\r
}\r
\r
function componentEvidenceFromReport(report, direction='similar', limit=3){\r
  const rows = [];\r
  for (const [familyName, family] of Object.entries(report?.family_distances || {})) {\r
    for (const component of family.components || []) {\r
      rows.push({\r
        family: familyName,\r
        name: component.name,\r
        distance: Number(component.distance || 0),\r
        weight: Number(component.weight || 0),\r
        impact: Number(component.distance || 0) * Number(component.weight || 0),\r
        explanation: component.explanation || ''\r
      });\r
    }\r
  }\r
  const sorted = rows.sort((a, b) => {\r
    if (direction === 'similar') return a.distance - b.distance || b.weight - a.weight || a.name.localeCompare(b.name);\r
    return b.impact - a.impact || b.distance - a.distance || a.name.localeCompare(b.name);\r
  });\r
  return sorted.slice(0, limit);\r
}\r
\r
function candidateWarnings(report){\r
  const warnings = [];\r
  const profile = report?.profile_scores || {};\r
  const family = report?.family_distances || {};\r
  const overall = profile.overall_weighted_similarity?.similarity ?? 0;\r
  const benefit = profile.benefit_architecture_similarity?.similarity ?? 0;\r
  const formula = profile.formula_similarity?.similarity ?? 0;\r
  const risk = profile.risk_complexity_similarity?.similarity ?? 0;\r
  const operationalDistance = family.operational_data_quality?.distance ?? 0;\r
  if (overall >= 0.75 && benefit < 0.60) warnings.push('Overall similarity masks low benefit architecture similarity.');\r
  if (overall >= 0.75 && formula < 0.55) warnings.push('Overall similarity masks formula implementation differences.');\r
  if (risk < 0.65 || operationalDistance > 0.35) warnings.push('Operational risk profile differs materially.');\r
  if ((report?.missing_metric_report || []).length) warnings.push('Some comparison metrics were missing or ignored.');\r
  return warnings;\r
}\r
\r
function reuseCandidateReportFromMatch(match, targetMetrics, record){\r
  const report = match.report;\r
  const profile = report.profile_scores || {};\r
  const family = report.family_distances || {};\r
  const topSimilarities = componentEvidenceFromReport(report, 'similar', 3);\r
  const topDifferences = (report.top_differences || componentEvidenceFromReport(report, 'different', 3)).slice(0, 5);\r
  return {\r
    report_type: 'reuse_candidate_report',\r
    metric_version: report.metric_version || ENGINE_COMPARISON_CONFIG.metric_version,\r
    generated_at: new Date().toISOString(),\r
    target_engine_id: targetMetrics?.engine_id || report.engine_a_id,\r
    candidate_engine_id: record.id,\r
    candidate_name: match.engine_name,\r
    candidate_source_name: record.sourceName || '',\r
    candidate_imported_at: record.importedAt || '',\r
    scores: {\r
      overall_similarity: profile.overall_weighted_similarity?.similarity || 0,\r
      overall_distance: profile.overall_weighted_similarity?.distance || 0,\r
      benefit_architecture_similarity: profile.benefit_architecture_similarity?.similarity || 0,\r
      formula_similarity: profile.formula_similarity?.similarity || 0,\r
      business_field_similarity: profile.business_field_similarity?.similarity || 0,\r
      structural_similarity: profile.structural_similarity?.similarity || 0,\r
      risk_complexity_similarity: profile.risk_complexity_similarity?.similarity || 0\r
    },\r
    family_scores: Object.fromEntries(\r
      Object.entries(family).map(([name, value]) => [name, {\r
        distance: value.distance,\r
        similarity: value.similarity\r
      }])\r
    ),\r
    top_similarities: topSimilarities,\r
    top_differences: topDifferences,\r
    warnings: candidateWarnings(report),\r
    missing_evidence: report.missing_metric_report || [],\r
    provenance: {\r
      candidate_schema_version: record.schemaVersion || '',\r
      candidate_metric_rows: (record.metricRows || []).length,\r
      candidate_counts: record.counts || {}\r
    },\r
    comparison_report: report\r
  };\r
}\r
\r
function rankWarehouseMatchesForMetrics(targetMetrics, records, options={}){\r
  const limit = Number(options.limit || 5);\r
  const excludeId = options.excludeId || '';\r
  const rows = [];\r
  const diagnostics = options.diagnostics || [];\r
  for (const record of records || []) {\r
    if (!record?.metrics) {\r
      diagnostics.push({\r
        record_id: record?.id || '',\r
        record_name: record?.displayName || record?.sourceName || record?.id || 'Unknown record',\r
        status: 'skipped',\r
        reason: 'missing_metrics',\r
        message: 'Record did not include metric warehouse data.'\r
      });\r
      continue;\r
    }\r
    if (excludeId && record.id === excludeId) continue;\r
    const report = compareMetricWarehouses(targetMetrics, record.metrics);\r
    const profile = report.profile_scores || {};\r
    const family = report.family_distances || {};\r
    const match = {\r
      engine_id: record.id,\r
      engine_name: record.displayName || record.sourceName || record.id,\r
      source_name: record.sourceName || '',\r
      overall_similarity: profile.overall_weighted_similarity?.similarity || 0,\r
      overall_distance: profile.overall_weighted_similarity?.distance || 0,\r
      benefit_similarity: profile.benefit_architecture_similarity?.similarity || 0,\r
      formula_similarity: profile.formula_similarity?.similarity || 0,\r
      risk_similarity: profile.risk_complexity_similarity?.similarity || 0,\r
      structural_distance: family.structural_graph?.distance || 0,\r
      top_difference: report.top_differences?.[0] || null,\r
      report\r
    };\r
    match.reuse_candidate_report = reuseCandidateReportFromMatch(match, targetMetrics, record);\r
    rows.push(match);\r
  }\r
  rows.sort((a, b) => b.overall_similarity - a.overall_similarity || a.overall_distance - b.overall_distance || a.engine_name.localeCompare(b.engine_name));\r
  return rows.slice(0, limit);\r
}\r
\r
function renderWarehouseMatches(matches){\r

function collectJsonTextBlocks(value, path='', out=[]){\r

    if (text) out.push({ path, text });\r
    return out;\r
  }\r
  if (Array.isArray(value)) {\r
    value.forEach((item, index) => collectJsonTextBlocks(item, \`\${path}[\${index}]\`, out));\r
    return out;\r
  }\r
  if (typeof value === 'object') {\r
    for (const [key, item] of Object.entries(value)) {\r
      collectJsonTextBlocks(item, path ? \`\${path}.\${key}\` : key, out);\r
    }\r
  }\r
  return out;\r
}\r

        const index = value.indexOf(pattern);\r
        if (index >= 0 && !hasNegatedR5Context(value, index)) {\r
          hits.push({ domain, strength, phrase: pattern });\r

  profile.domain_strength_counts[strength] = (profile.domain_strength_counts[strength] || 0) + 1;\r
  if (!profile.domain_evidence[domain]) profile.domain_evidence[domain] = [];\r

    weak_domain_hits: {},\r

    strong_evidence_count: 0,\r
    medium_evidence_count: 0,\r
    weak_evidence_count: 0,\r

    for (const token of tokens) upload.token_counts[token] = (upload.token_counts[token] || 0) + 1;\r

    profile.source_count++;\r

    profile.material_evidence_count += Number(upload.strong_evidence_count || 0) + Number(upload.medium_evidence_count || 0);\r

EXTRACTION INSTRUCTIONS
1. Build the documents registry first. Each source document must have an entry in "documents".
2. Extract plan metadata strictly from the provided documents. Do not infer from filenames unless the filename text is explicitly repeated in the document.
3. For every known value, include at least one citation with a precise locator (section/heading/line or a short snippet).
4. If multiple documents conflict, include the most recent effective date and add a note in meta.notes with citations.
5. If a field is absent, set value to "unknown" and citations to [].
6. Any additional plan attributes not represented in the core schema must be placed in "other_attributes".
7. For PBGC Lump Sum Rates, store each segment as the full cell text (e.g., "First Segment: 0.69% for first 5 years").
8. For PBGC Annuity Rates, store each stacked cell as full text (e.g., "1.69% for 20 years", "1.66% thereafter").
