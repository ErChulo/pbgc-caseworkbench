*{box-sizing:border-box}\r
html,body{height:100%}\r
body{margin:0;color:var(--text);font-family:var(--font);background:var(--body-bg)}\r
.app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:10px;padding:10px}\r
.topbar{display:grid;grid-template-columns:minmax(0,3fr) minmax(240px,1fr);gap:10px;align-items:stretch}\r
.top-panel{background:var(--pane-bg);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:10px 12px}\r
.controls-panel{display:grid;gap:8px;order:2}\r
.controls-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;align-items:end}\r
.utility-panel{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;order:1}\r
.brand-mark{width:50px;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--logo-bg);display:grid;place-items:center;box-shadow:var(--shadow)}\r
.brand-title{display:grid;gap:4px;min-width:0}\r
.brand-title h2{margin:0;font-size:22px;line-height:1.02;letter-spacing:.01em}\r
.brand-sub{font-size:11px;color:var(--muted);line-height:1.2}\r

const WAREHOUSE_DB_NAME = 'pbgc-v1-engine-explorer';\r
const WAREHOUSE_DB_VERSION = 1;\r

const WAREHOUSE_TIMEOUT_MS = 1200;\r

function warehouseAvailable(){\r

\r
function openWarehouseDb(){\r

  return new Promise((resolve, reject) => {\r
    const request = indexedDB.open(WAREHOUSE_DB_NAME, WAREHOUSE_DB_VERSION);\r
    request.onupgradeneeded = () => {\r
      const db = request.result;\r
      if (!db.objectStoreNames.contains(WAREHOUSE_STORE)) {\r
        const store = db.createObjectStore(WAREHOUSE_STORE, { keyPath: 'id' });\r
        store.createIndex('importedAt', 'importedAt');\r
        store.createIndex('displayName', 'displayName');\r
      }\r
    };\r
    request.onsuccess = () => resolve(request.result);\r
    request.onerror = () => reject(request.error || new Error('Could not open engine warehouse.'));\r
  });\r

function warehouseRequest(method){\r

    const store = tx.objectStore(WAREHOUSE_STORE);\r
    const request = method.run(store);\r
    request.onsuccess = () => resolve(request.result);\r
    request.onerror = () => reject(request.error || tx.error || new Error('Warehouse request failed.'));\r
    tx.oncomplete = () => db.close();\r
    tx.onerror = () => {\r
      db.close();\r
      reject(tx.error || new Error('Warehouse transaction failed.'));\r
    };\r
  }));\r

      clearTimeout(timer);\r
      resolve(value);\r
    }, error => {\r

      settled = true;\r
      clearTimeout(timer);\r

function buildBidirectionalGraph(root, backwardDepth, forwardDepth){\r
  const backBest = new Map();\r
  const forwardBest = new Map();\r
  backBest.set(root, 0);\r
  forwardBest.set(root, 0);\r
\r
  const backQueue = [[root, 0]];\r
  while (backQueue.length) {\r
    const [nodeId, dist] = backQueue.shift();\r
    if (dist >= backwardDepth) continue;\r
    for (const ref of refsFor(nodeId)) {\r
      if (!graphNodeAllowed(ref)) continue;\r
      const nd = dist + 1;\r

  }\r

  const forwardQueue = [[root, 0]];\r
  while (forwardQueue.length) {\r
    const [nodeId, dist] = forwardQueue.shift();\r
    if (dist >= forwardDepth) continue;\r
    for (const dep of DATA.dependents[nodeId] || []) {\r
      if (!graphNodeAllowed(dep)) continue;\r

      if (!forwardBest.has(dep) || nd < forwardBest.get(dep)) {\r

  for (const k of forwardBest.keys()) if (graphNodeAllowed(k)) allIds.add(k);\r

  const nodes = [];\r
  for (const id of allIds) {\r
    const backDist = backBest.has(id) ? backBest.get(id) : null;\r
    const fwdDist = forwardBest.has(id) ? forwardBest.get(id) : null;\r
    let layer = 0;\r
    if (id === root) {\r
      layer = 0;\r
    } else if (backDist != null && fwdDist != null) {\r

    } else if (backDist != null) {\r
      layer = -backDist;\r
    } else if (fwdDist != null) {\r
      layer = fwdDist;\r
    }\r
    nodes.push({\r
      id,\r
      layer,\r
      field: preferredLabelForNode(id),\r
      description: descriptionForNode(id),\r
      hasFormula: formulaAvailableForCurrentRun(id),\r
      type: nodeTypeFor(id)\r

  const edgeMap = new Map();\r

    const sLayer = nodeById[source].layer;\r
    const tLayer = nodeById[target].layer;\r

  for (const n of nodes) {\r
    for (const ref of refsFor(n.id)) addEdge(ref, n.id);\r
    for (const dep of DATA.dependents[n.id] || []) {\r
      if (formulaAvailableForCurrentRun(dep)) addEdge(n.id, dep);\r
    }\r
  }\r
  const edges = [...edgeMap.values()];\r
\r
  const incoming = new Map();\r
  const outgoing = new Map();\r
  for (const e of edges) {\r
    if (!incoming.has(e.target)) incoming.set(e.target, []);\r
    if (!outgoing.has(e.source)) outgoing.set(e.source, []);\r
    incoming.get(e.target).push(e.source);\r
    outgoing.get(e.source).push(e.target);\r
  }\r
\r
  const minLayer = Math.min(...nodes.map(n => n.layer));\r
  const maxLayer = Math.max(...nodes.map(n => n.layer));\r
  const layersMap = new Map();\r
  for (let d = minLayer; d <= maxLayer; d++) layersMap.set(d, []);\r
  for (const n of nodes) layersMap.get(n.layer).push(n);\r
\r
  const rootLayer = layersMap.get(0) || [];\r
  rootLayer.sort((a,b) => (a.field || a.id).localeCompare(b.field || b.id));\r
\r
  for (let d = 1; d <= maxLayer; d++) {\r
    const arr = layersMap.get(d) || [];\r
    const prev = layersMap.get(d - 1) || [];\r
    const prevOrder = new Map(prev.map((n, i) => [n.id, i]));\r
    arr.sort((a, b) => {\r
      const aa = (incoming.get(a.id) || []).filter(id => (nodeById[id]?.layer ?? 99) === d - 1).map(id => prevOrder.get(id) ?? 0);\r
      const bb = (incoming.get(b.id) || []).filter(id => (nodeById[id]?.layer ?? 99) === d - 1).map(id => prevOrder.get(id) ?? 0);\r
      const av = aa.length ? aa.reduce((x,y)=>x+y,0) / aa.length : 0;\r

    const nextOrder = new Map(next.map((n, i) => [n.id, i]));\r
    arr.sort((a, b) => {\r

      const bb = (outgoing.get(b.id) || []).filter(id => (nodeById[id]?.layer ?? -99) === d + 1).map(id => nextOrder.get(id) ?? 0);\r
      const av = aa.length ? aa.reduce((x,y)=>x+y,0) / aa.length : 0;\r
      const bv = bb.length ? bb.reduce((x,y)=>x+y,0) / bb.length : 0;\r

    });\r
  }\r
\r
  for (const n of nodes) {\r
    const primary = n.field || n.id;\r
    const sourceTab = isNamedRange(n.id) ? '' : sourceTabForNode(n.id);\r
    const secondary = isNamedRange(n.id) ? 'Named range' : (sourceTab ? \`Tab: \${sourceTab}\` : 'Tab: -');\r
    const tertiary = isNamedRange(n.id) ? '' : localCellForNode(n.id);\r
    n.label1 = primary;\r
    n.label2 = secondary;\r
    n.label3 = tertiary;\r
    const primaryLen = String(primary).length;\r
    const secondaryLen = String(secondary).length;\r
    const tertiaryLen = String(tertiary).length;\r
    const est = Math.max(primaryLen * 8.4 + 34, secondaryLen * 7.2 + 30, tertiaryLen * 7.2 + 30);\r
    n.w = Math.max(156, Math.min(560, est));\r
    n.h = isNamedRange(n.id) ? 54 : 68;\r
  }\r
\r
  const spacingScale = (appState.nodeSpacing || 100) / 100;\r
  const gapX = 62 * spacingScale;\r
  const gapYBase = 16 * spacingScale;\r
  const padX = 30;\r
  const padY = 22;\r
\r
  const layerKeys = [];\r
  for (let d = minLayer; d <= maxLayer; d++) layerKeys.push(d);\r
  const columnWidths = layerKeys.map(d => {\r
    const arr = layersMap.get(d) || [];\r
    return arr.length ? Math.max(...arr.map(n => n.w)) : 136;\r
  });\r
  const columnX = new Map();\r
  let xCursor = padX;\r
  layerKeys.forEach((d, idx) => {\r
    const w = columnWidths[idx];\r

  });\r
\r
  let graphHeight = 0;\r
  for (const d of layerKeys) {\r
    const arr = layersMap.get(d) || [];\r
    const total = arr.reduce((sum,n)=>sum+n.h,0) + Math.max(0, arr.length - 1) * gapYBase;\r

  const graphWidth = Math.max(360, xCursor - gapX + padX);\r

  for (const d of layerKeys) {\r

    const totalH = arr.reduce((sum,n)=>sum+n.h,0) + Math.max(0, arr.length - 1) * gapYBase;\r
    let y = Math.max(padY, (graphHeight - totalH) / 2);\r
    for (const n of arr) {\r
      n.x = columnX.get(d);\r
      n.y = y + n.h / 2;\r
      y += n.h + gapYBase;\r
    }\r
  }\r

  return { nodes, edges, width: graphWidth, height: graphHeight, minLayer, maxLayer, nodeById };\r
}\r
